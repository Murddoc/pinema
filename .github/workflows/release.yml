# Publication automatique, déclenchée par une étiquette vX.Y.Z (créée par `npm run release`).
# 1. vérifie le code et construit l'archive ;
# 2. crée la release GitHub avec l'archive ;
# 3. envoie l'archive au Chrome Web Store et la soumet à la relecture de Google.
#
# Configuration (une seule fois, dans Settings du dépôt GitHub) :
#   Secrets  → CWS_SERVICE_ACCOUNT_KEY : clé JSON du compte de service Google Cloud
#   Variables → CWS_PUBLISHER_ID, CWS_EXTENSION_ID
# Tant qu'elles manquent, l'étape 3 est sautée (utile avant la première publication manuelle).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier que l'étiquette correspond à la version du manifest
        if: github.ref_type == 'tag'
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::étiquette ${GITHUB_REF_NAME} ≠ manifest v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Vérifier et construire l'archive
        run: |
          npm run zip
          echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"

      - name: Release GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/pinema-${VERSION}.zip" --title "Pinema ${VERSION}" --generate-notes

      - name: Web Store configuré ?
        id: cws
        env:
          KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "${{ vars.CWS_PUBLISHER_ID }}" ] && [ -n "${{ vars.CWS_EXTENSION_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Web Store non configuré : archive construite mais pas envoyée."
          fi

      - name: Connexion Google (compte de service)
        if: steps.cws.outputs.ok == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Envoi et soumission au Chrome Web Store
        if: steps.cws.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
          UPLOAD: https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $TOKEN")

          echo "→ Envoi de l'archive"
          res=$(curl -sS --fail-with-body "${auth[@]}" -X POST -T "dist/pinema-${VERSION}.zip" "$UPLOAD:upload")
          echo "$res"
          state=$(echo "$res" | jq -r '.uploadState // empty')

          # L'envoi peut être traité en différé : on attend la fin (5 min max)
          for i in $(seq 1 30); do
            case "$state" in
              SUCCEEDED) break ;;
              FAILED) echo "::error::envoi refusé par le Web Store"; exit 1 ;;
            esac
            sleep 10
            res=$(curl -sS --fail-with-body "${auth[@]}" "$ITEM:fetchStatus")
            state=$(echo "$res" | jq -r '.lastAsyncUploadState // empty')
            echo "état : $state"
          done
          [ "$state" = "SUCCEEDED" ] || { echo "::error::envoi non terminé ($state)"; echo "$res"; exit 1; }

          echo "→ Soumission à la relecture"
          curl -sS --fail-with-body "${auth[@]}" -H "Content-Type: application/json" \
            -X POST -d '{"publishType":"DEFAULT_PUBLISH"}' "$ITEM:publish" | tee publish.json
          echo
          echo "::notice::Version ${VERSION} soumise : publication automatique après validation par Google."
